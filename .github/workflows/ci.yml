name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `channel: stable`. An unpinned channel means the formatter
      # and analyzer rules change under the repository without a commit, and
      # `dart format --set-exit-if-changed` then fails a build that nobody
      # touched — which is exactly how this job went red. Bumping this is a
      # deliberate act: run `dart format .` and commit the result with it.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run analyzer (zero warnings enforced)
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --reporter=github

  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `channel: stable`. An unpinned channel means the formatter
      # and analyzer rules change under the repository without a commit, and
      # `dart format --set-exit-if-changed` then fails a build that nobody
      # touched — which is exactly how this job went red. Bumping this is a
      # deliberate act: run `dart format .` and commit the result with it.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: survive-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  evals:
    name: Evals (lexical path)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # survive_rag itself has no third-party dependencies; these are dev only.
      - name: Install dev tools
        run: pip install pytest ruff

      - name: Lint
        run: ruff check survive_rag evals tests --line-length 100

      - name: Unit tests
        run: python -m pytest tests -q

      # Fails the build if a guide edit invalidated a hand-authored label in
      # either golden set, which would otherwise silently depress every score.
      - name: Validate golden sets
        run: python -m evals validate

      # Everything below runs the lexical path only. The dense leg, the
      # generation eval and the perf numbers all need model downloads, which do
      # not belong in a per-push job; they are run in the lab and recorded in
      # docs/RESULTS.md.
      #
      # It therefore compares against the `retrieval` baseline, which is the
      # lexical one. The shipping configuration has its own,
      # `retrieval-shipping`, so this job cannot report a wall of imaginary
      # regressions against numbers it never had the models to reproduce.
      - name: Retrieval eval
        run: python -m evals eval --html reports/eval.html --check-regressions

      - name: Multi-turn eval
        run: python -m evals multiturn --no-dense

      - name: Context window utilisation
        run: python -m evals context --no-dense -n 60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: python/reports/eval.html
