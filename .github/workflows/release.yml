name: Release

# Tag-triggered, not push-triggered. A per-push build is a test that the app
# compiles; a release is a file people install on a phone they may be relying
# on during an emergency, and those deserve different triggers.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Produces a GitHub Release with the signed APK and its SHA-256 attached, both
# permanently and publicly downloadable. The per-push CI artifact is neither:
# it expires after seven days and requires a GitHub login, so it was never a
# distribution channel despite looking like one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Pinned for the same reason CI is: an unpinned channel changes the
      # toolchain under a release without a commit.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      # Refuse before building rather than after. Without a real keystore the
      # Gradle config falls back to debug signing, and a debug-signed APK is
      # signed with the publicly shared Android debug key: anyone can build an
      # "update" that the OS accepts as the same app. Publishing one of those
      # for a sideloaded safety app is worse than publishing nothing.
      - name: Require a release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            echo "A release must be signed with the project's own key, not the"
            echo "Android debug key. See docs/INSTALLATION.md for how to create"
            echo "the keystore and which four secrets to set."
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/release-keystore.jks
          cat > android/app/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      # The index and its vectors are committed, so a tag builds exactly the
      # artifacts the parity tests ran against. Verified here rather than
      # assumed: a release whose corpus does not match its vectors would
      # retrieve nonsense, with no error.
      - name: Verify the shipped artifacts are present
        run: |
          for f in corpus.json passages.f32 passages.f32.json tokenizer.bin; do
            test -s "assets/index/$f" || { echo "::error::missing assets/index/$f"; exit 1; }
          done

      - name: Test
        run: flutter test

      # The version has to come from the tag, not from pubspec.yaml. Left to
      # pubspec every release would build as versionName 1.0.0 with versionCode
      # 1, and Android does not treat an equal versionCode as an upgrade — so
      # v1.0.1 would not install over v1.0.0 on a phone that already had it.
      # build-number is the workflow run number, which only ever increases.
      - name: Build release APK
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          flutter build apk --release --target-platform android-arm64 \
            --build-name="${TAG#v}" \
            --build-number="${{ github.run_number }}"

      - name: Report what was built
        run: |
          echo "versionName: ${TAG#v}"
          unzip -l build/app/outputs/flutter-apk/app-release.apk \
            | grep -cE 'assets/flutter_assets/assets/index' \
            | xargs -I{} echo "index assets present: {} of 4"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Checksum and rename
        id: artifact
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="survive-ai-${TAG}-arm64.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 < "$NAME.sha256")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      # Fails the release if the APK is signed with the Android debug key, which
      # is what the Gradle fallback produces. Checking the output beats trusting
      # that the secret was wired up correctly.
      - name: Reject a debug-signed APK
        run: |
          OWNER=$(keytool -printcert -jarfile "${{ steps.artifact.outputs.name }}" \
                  | grep -m1 'Owner:' || true)
          echo "Signed by: $OWNER"
          if echo "$OWNER" | grep -q 'CN=Android Debug'; then
            echo "::error::APK is debug-signed; refusing to publish."
            exit 1
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Survive AI ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.name }}.sha256
          body: |
            **${{ steps.artifact.outputs.name }}** — ${{ steps.artifact.outputs.size }}, arm64-v8a only.

            Verify the download before installing:

            ```
            sha256sum ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.sha }}
            ```

            Requires Android 7.0+ and a 64-bit ARM device. 6 GB RAM minimum,
            8 GB recommended. The app downloads its ~500 MB language model over
            WiFi on first launch; the optional 175 MB search model can be added
            later from Settings.

            Not medical advice, and not a substitute for emergency services
            (112 in India).
