name: Release

# Tag-triggered, not push-triggered. A per-push build is a test that the app
# compiles; a release is a file people install on a phone they may be relying
# on during an emergency, and those deserve different triggers.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Produces a GitHub Release with the signed APK and its SHA-256 attached, both
# permanently and publicly downloadable. The per-push CI artifact is neither:
# it expires after seven days and requires a GitHub login, so it was never a
# distribution channel despite looking like one.
#
# The iOS job below runs at the same tag against the same commit, so a release
# cannot exist for one platform and not the other. It stops short of publishing
# an installable iOS build: there is no sideloading on iOS, so distribution
# means TestFlight or the App Store, which means an Apple Developer account and
# the four secrets listed in that job. Without them it still builds and still
# fails the release if the iOS project is broken at the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Pinned for the same reason CI is: an unpinned channel changes the
      # toolchain under a release without a commit.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      # Refuse before building rather than after. Without a real keystore the
      # Gradle config falls back to debug signing, and a debug-signed APK is
      # signed with the publicly shared Android debug key: anyone can build an
      # "update" that the OS accepts as the same app. Publishing one of those
      # for a sideloaded safety app is worse than publishing nothing.
      - name: Require a release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            echo "A release must be signed with the project's own key, not the"
            echo "Android debug key. See docs/INSTALLATION.md for how to create"
            echo "the keystore and which four secrets to set."
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/release-keystore.jks
          cat > android/app/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      # The index and its vectors are committed, so a tag builds exactly the
      # artifacts the parity tests ran against. Verified here rather than
      # assumed: a release whose corpus does not match its vectors would
      # retrieve nonsense, with no error.
      - name: Verify the shipped artifacts are present
        run: |
          for f in corpus.json passages.f32 passages.f32.json tokenizer.bin; do
            test -s "assets/index/$f" || { echo "::error::missing assets/index/$f"; exit 1; }
          done

      - name: Test
        run: flutter test

      # The version has to come from the tag, not from pubspec.yaml. Left to
      # pubspec every release would build as versionName 1.0.0 with versionCode
      # 1, and Android does not treat an equal versionCode as an upgrade — so
      # v1.0.1 would not install over v1.0.0 on a phone that already had it.
      # build-number is the workflow run number, which only ever increases.
      - name: Build release APK
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          flutter build apk --release --target-platform android-arm64 \
            --build-name="${TAG#v}" \
            --build-number="${{ github.run_number }}"

      - name: Report what was built
        run: |
          echo "versionName: ${TAG#v}"
          unzip -l build/app/outputs/flutter-apk/app-release.apk \
            | grep -cE 'assets/flutter_assets/assets/index' \
            | xargs -I{} echo "index assets present: {} of 4"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Checksum and rename
        id: artifact
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="survive-ai-${TAG}-arm64.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 < "$NAME.sha256")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$NAME" | cut -f1)" >> "$GITHUB_OUTPUT"

      # Fails the release unless the APK is signed by the project's own release
      # key. Checking the output beats trusting that the secret was wired up.
      #
      # apksigner, not keytool: with minSdk 24 AGP signs with APK Signature
      # Scheme v2/v3 only and writes no v1 JAR signature, so
      # `keytool -printcert -jarfile` finds no signer, prints nothing, and a
      # grep for the debug key passes vacuously. It did exactly that for
      # v2.1.0. apksigner reads the v2/v3 blocks, and exits non-zero if the
      # signature does not verify at all.
      #
      # Three checks, each closing a different hole: exactly one signer (an
      # empty result is a failure, not a pass), not the Android debug key, and
      # the cert digest equals the release cert's. The last one alone would
      # suffice; the first two make the failure message say what went wrong.
      #
      # EXPECTED_CERT_SHA256 is public (it is the cert, not the key) and is what
      # users can compare against `apksigner verify --print-certs` themselves.
      # Rotating the key means changing it here, deliberately.
      #
      # Log note: the ANDROID_KEY_ALIAS secret's value is "survive-ai", so
      # GitHub masks every occurrence of that string in this job's logs as ***
      # (file names, the release title). Cosmetic; renaming the alias would
      # need the keystore re-exported, which is not worth it for log output.
      - name: Verify the APK is signed with the release key
        env:
          APK: ${{ steps.artifact.outputs.name }}
          EXPECTED_CERT_SHA256: 630a587b4d65689672c0639f6a9df58b7bab0072b93b3f133177b567d5c3e630
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under \$ANDROID_HOME/build-tools."
            exit 1
          fi
          echo "Using $APKSIGNER"

          if ! CERTS=$("$APKSIGNER" verify --verbose --print-certs "$APK"); then
            echo "$CERTS"
            echo "::error::apksigner could not verify the APK signature."
            exit 1
          fi
          echo "$CERTS"

          SIGNERS=$(echo "$CERTS" | grep -cE '^Signer #[0-9]+ certificate DN:' || true)
          if [ "$SIGNERS" -ne 1 ]; then
            echo "::error::Expected exactly one signer, found $SIGNERS; refusing to publish."
            exit 1
          fi
          if echo "$CERTS" | grep -q 'CN=Android Debug'; then
            echo "::error::APK is debug-signed; refusing to publish."
            exit 1
          fi
          DIGEST=$(echo "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: *//p' | tr 'A-F' 'a-f')
          if [ "$DIGEST" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signer cert SHA-256 is '$DIGEST', expected $EXPECTED_CERT_SHA256; refusing to publish."
            exit 1
          fi
          echo "Signed with the release key ($DIGEST)."

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Survive AI ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.name }}.sha256
          body: |
            **${{ steps.artifact.outputs.name }}** — ${{ steps.artifact.outputs.size }}, arm64-v8a only.

            Verify the download before installing:

            ```
            sha256sum ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.sha }}
            ```

            Requires Android 7.0+ and a 64-bit ARM device. 6 GB RAM minimum,
            8 GB recommended. The app downloads its 1.3 GB language model over
            Wi-Fi on first launch (never mobile data); the optional 175 MB
            search model can be added later from Settings. Budget about 2 GB of
            free storage.

            Not medical advice, and not a substitute for emergency services
            (112 in India).

  # Runs against the same tag and the same commit as the APK job. Independent of
  # it on purpose: an Android signing problem should not hide an iOS compile
  # failure, and vice versa.
  ios:
    name: Build iOS at the tag
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify the shipped artifacts are present
        run: |
          for f in corpus.json passages.f32 passages.f32.json tokenizer.bin; do
            test -s "assets/index/$f" || { echo "::error::missing assets/index/$f"; exit 1; }
          done

      - name: Test
        run: flutter test

      # Same reasoning as the APK: the version has to come from the tag. On iOS
      # it is CFBundleShortVersionString and CFBundleVersion, and App Store
      # Connect rejects an upload whose CFBundleVersion it has already seen —
      # the exact iOS analogue of Android refusing an equal versionCode.
      - name: Build iOS (unsigned)
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          flutter build ios --release --no-codesign \
            --build-name="${TAG#v}" \
            --build-number="${{ github.run_number }}"

      - name: Report what was built
        run: |
          APP=build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          ls "$APP/Frameworks/App.framework/flutter_assets/assets/index"
          du -sh "$APP"

      # An unsigned .app cannot be installed on a phone. It is uploaded so the
      # build is inspectable — bundle contents, Info.plist, entitlements — and
      # so a broken tag is visible without a Mac.
      #
      # To publish to TestFlight instead, add these four repository secrets and
      # replace this step with an xcodebuild archive + export:
      #   APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD,
      #   APPLE_PROVISIONING_PROFILE_BASE64, APPLE_API_KEY
      # Nothing here is wired up speculatively, because a signing pipeline that
      # has never run once is not a signing pipeline.
      - name: Upload the unsigned app bundle
        uses: actions/upload-artifact@v4
        with:
          name: survive-ai-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          retention-days: 14
